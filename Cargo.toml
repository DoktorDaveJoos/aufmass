[package]
name = "aufmass"
version = "0.1.0"
edition = "2024"

[dependencies]
acadrust = "0.6.8"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rust_xlsxwriter = "0.102.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[workspace]
members = [".", "app"]

[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "aufmass"
version.workspace = true
publish = false
edition = "2024"

[dependencies]
acadrust = "0.6.8"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rust_xlsxwriter = "0.102.0"
self-replace = "1.5"
sentry = { version = "0.49.5", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "ureq", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zipsign-api = { version = "0.2", default-features = false, features = ["verify-zip"] }

[workspace]
members = [".", "app"]

# One version for the CLI and the app; a release tag vX.Y.Z must match it.
[workspace.package]
version = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
# Line tables in a separate .pdb/.dSYM, uploaded to Sentry by CI for readable
# crash stack traces; the shipped binaries stay small.
debug = "line-tables-only"
split-debuginfo = "packed"

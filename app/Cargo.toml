[package]
name = "aufmass-app"
version.workspace = true
publish = false
edition = "2024"
description = "Desktop app for Aufmaß: drop architect plans, get quantities, plans and a 3D preview"

[[bin]]
name = "aufmass-app"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aufmass = { path = ".." }
# Where Documents is on each platform (known folders on Windows, OneDrive included), as in Thermkern.
dirs = "=7.0.0"
gpui = "=0.2.2"
image = { version = "0.25", default-features = false }
# Local time with the system's time zone for the recent list, also on Windows (tzdb bundled there), as in Thermkern.
jiff = "=0.2.38"
resvg = "0.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Compile the Metal shaders at startup, so building needs no Xcode Metal toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
# Sets the Dock icon; a bare binary has no app bundle to take it from.
objc = "0.2.7"

[build-dependencies]
embed-resource = "3"

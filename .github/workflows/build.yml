# Builds the CLI and the desktop app for macOS and Windows.
# GPUI compiles its Windows (DirectX) shaders with the Windows SDK, so the
# Windows binaries have to be built on Windows; this runs both side by side.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: aufmass-macos-arm64
          - os: windows-latest
            artifact: aufmass-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --workspace --release

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          cp target/release/aufmass target/release/aufmass-app aufmass.toml packaging/LIESMICH.txt dist/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/aufmass.exe, target/release/aufmass-app.exe, aufmass.toml, packaging/LIESMICH.txt dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
